; Currawong haptic knob: standalone test firmware
; Build and flash:  pio run -t upload      Serial log:  pio device monitor
[env:xiao_esp32s3]
platform = espressif32 @ ^6.6.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
    askuric/Simple FOC @ 2.3.3   ; 2.3.4+ needs Arduino-ESP32 3.x, which PlatformIO doesn't ship yet
build_flags =
    ; USB-C is the debug serial port, so UART0 (GPIO43/44) stays free for the motor and the Pi link
    -D ARDUINO_USB_CDC_ON_BOOT=1
